# grype configuration: dependency/CVE scanning over the repo filesystem
# (Cargo.lock and the GitHub Actions the workflows use). High/critical findings
# fail the scan; lower severities are reported.

fail-on-severity: high

# Directory scans: skip build outputs and scanner output.
exclude:
  - ./target/**
  - ./sast-out/**

# Accepted findings, each with a comment explaining why.
ignore: []
