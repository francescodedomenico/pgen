[package]
name = "pgen"
version = "0.1.0"
edition = "2021"
description = "A very simple and very fast command-line password generator"
license = "Apache-2.0"
repository = "https://github.com/francescodedomenico/pgen"

[profile.release]
strip = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
serde_json = "1.0"
