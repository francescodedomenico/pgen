[package]
name = "pgen"
version = "0.1.2"
edition = "2024"
# Minimum supported Rust: what clap 4.6 and rand 0.10 need; CI checks it.
rust-version = "1.85"
description = "A very simple and very fast command-line password generator"
license = "Apache-2.0"
repository = "https://github.com/francescodedomenico/pgen"

[profile.release]
strip = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
serde_json = "1.0"
